<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Guardião da Integridade — R2PHARMA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

:root {
  --background: 194 42% 96%;
  --foreground: 207 82% 18%;
  --border: 193 35% 80%;
  --input: 193 35% 80%;
  --ring: 191 52% 43%;
  --card: 195 50% 99%;
  --card-foreground: 207 82% 18%;
  --card-border: 193 35% 80%;
  --popover: 195 50% 99%;
  --popover-foreground: 207 82% 18%;
  --primary: 207 82% 27%;
  --primary-foreground: 195 50% 99%;
  --secondary: 181 49% 58%;
  --secondary-foreground: 207 82% 18%;
  --muted: 193 38% 89%;
  --muted-foreground: 207 25% 40%;
  --accent: 204 66% 49%;
  --accent-foreground: 195 50% 99%;
  --destructive: 3 59% 46%;
  --destructive-foreground: 195 50% 99%;
  --app-font-sans: 'DM Sans', sans-serif;
  --app-font-serif: 'Fraunces', Georgia, serif;
  --app-font-mono: 'DM Sans', sans-serif;
  --radius: 1rem;
  --shadow-sm: 0 3px 12px hsl(196 42% 16% / 0.08);
  --shadow-md: 0 14px 34px hsl(196 42% 16% / 0.11);
}

* { box-sizing: border-box; border-color: hsl(var(--border)); }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--app-font-sans);
  -webkit-font-smoothing: antialiased;
  background: hsl(var(--background));
  color: hsl(var(--foreground));
}
button, [role='button'] { font: inherit; }
button:focus-visible, [tabindex='0']:focus-visible {
  outline: 3px solid hsl(var(--secondary));
  outline-offset: 3px;
}

.lms-app {
  min-height: 100dvh;
  background:
    radial-gradient(circle at 9% 0%, hsl(181 49% 58% / .16), transparent 29rem),
    radial-gradient(circle at 94% 94%, hsl(207 82% 27% / .13), transparent 34rem),
    hsl(var(--background));
  position: relative;
  overflow: hidden;
}
.lms-app::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  z-index: 5;
}
.topbar {
  height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 clamp(1rem, 4vw, 4rem);
  border-bottom: 1px solid hsl(var(--border) / .75);
  background: hsl(var(--background) / .84);
  backdrop-filter: blur(14px);
  position: relative;
  z-index: 10;
}
.brand {
  color: hsl(var(--foreground));
  display: flex;
  gap: .65rem;
  align-items: center;
  font-weight: 700;
  letter-spacing: -.02em;
}
.brand-logo { width: clamp(126px, 11vw, 164px); height: auto; display: block; object-fit: contain; }
.brand-copy { line-height: 1.02; display: flex; align-items: center; }
.brand-copy small { display: block; max-width: 94px; font-size: .57rem; line-height: 1.35; letter-spacing: .12em; text-transform: uppercase; color: hsl(var(--muted-foreground)); }
.progress-wrap { display: flex; align-items: center; gap: .8rem; }
.progress-text { font-size: .73rem; letter-spacing: .08em; color: hsl(var(--muted-foreground)); text-transform: uppercase; }
.progress-track { width: clamp(90px, 15vw, 190px); height: 5px; background: hsl(var(--muted)); border-radius: 99px; overflow: hidden; }
.progress-value { height: 100%; background: hsl(var(--secondary)); border-radius: inherit; transition: width .5s ease; }

.stage-nav { display: flex; align-items: center; gap: .3rem; }
.stage-dot { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid hsl(var(--border)); background: hsl(var(--card)); color: hsl(var(--muted-foreground)); display: grid; place-items: center; font-size: .68rem; font-weight: 700; cursor: not-allowed; transition: all .2s ease; flex: none; }
.stage-dot.reachable { cursor: pointer; }
.stage-dot.reachable:hover { border-color: hsl(var(--secondary)); transform: translateY(-1px); }
.stage-dot.done { background: hsl(var(--primary)); border-color: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
.stage-dot.current { border-color: hsl(var(--secondary)); box-shadow: 0 0 0 3px hsl(var(--secondary) / .25); color: hsl(var(--primary)); background: hsl(var(--card)); }
.stage-dot-sep { width: 12px; height: 1px; background: hsl(var(--border)); flex: none; }
.btn-back { color: hsl(var(--muted-foreground)); background: transparent; border: none; padding: .5rem .4rem; cursor: pointer; display: inline-flex; align-items: center; gap: .3rem; font-size: .78rem; font-weight: 600; border-radius: 999px; transition: color .2s, background .2s; }
.btn-back:hover { color: hsl(var(--primary)); background: hsl(var(--muted)); }

.example-tag { display: flex; gap: .5rem; align-items: flex-start; margin-top: .7rem; padding-top: .7rem; border-top: 1px dashed hsl(var(--primary) / .25); font-size: .82rem; line-height: 1.5; }
.example-tag svg { flex: none; margin-top: .15rem; color: hsl(var(--secondary)); }

.review-panel { grid-column: 1/-1; margin-top: .9rem; border: 1px solid hsl(var(--border)); border-radius: 1.2rem; padding: 1.1rem 1.3rem; background: hsl(var(--card) / .6); animation: stage-in .3s ease both; }
.review-item { display: flex; align-items: flex-start; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid hsl(var(--border) / .6); font-size: .8rem; line-height: 1.45; }
.review-item:last-child { border-bottom: none; }
.review-item.ok svg { color: hsl(var(--primary)); }
.review-item.bad svg { color: hsl(var(--destructive)); }
.review-item svg { flex: none; margin-top: .15rem; }
.review-item .fix { display: block; color: hsl(var(--muted-foreground)); margin-top: .15rem; }

.recap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; margin: 1.6rem 0; text-align: left; }
.recap-card { border: 1px solid hsl(var(--border)); border-radius: 1rem; padding: .9rem 1rem; background: hsl(var(--card) / .7); }
.recap-card span { display: block; font-size: .65rem; text-transform: uppercase; letter-spacing: .1em; color: hsl(var(--muted-foreground)); margin-bottom: .35rem; }
.recap-card strong { font-family: var(--app-font-serif); font-size: 1.5rem; color: hsl(var(--primary)); display: block; }
.recap-card small { color: hsl(var(--muted-foreground)); font-size: .72rem; }
@media (max-width: 620px) { .recap-grid { grid-template-columns: 1fr; } }

.name-input-wrap { margin-top: 1.9rem; }
.name-input-label { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .1em; color: hsl(var(--muted-foreground)); margin-bottom: .55rem; font-weight: 700; }
.name-input { width: 100%; max-width: 380px; padding: .9rem 1.2rem; border-radius: 999px; border: 1.5px solid hsl(var(--border)); background: hsl(var(--card)); font: inherit; font-size: .95rem; color: hsl(var(--foreground)); transition: border-color .2s, box-shadow .2s; }
.name-input::placeholder { color: hsl(var(--muted-foreground)); }
.name-input:focus { outline: none; border-color: hsl(var(--secondary)); box-shadow: 0 0 0 3px hsl(var(--secondary) / .22); }

.doctype-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; }
@media (max-width: 620px) { .doctype-grid { grid-template-columns: 1fr; } }
.doctype-card { text-align: left; border: 1px solid hsl(var(--border)); background: hsl(var(--card) / .72); border-radius: 1.2rem; padding: 1.15rem; cursor: pointer; transition: transform .22s ease, border-color .22s ease, background .22s ease; }
.doctype-card:hover { transform: translateY(-4px); border-color: hsl(var(--secondary)); }
.doctype-card.selected { border-color: hsl(var(--primary)); background: hsl(var(--primary) / .08); box-shadow: inset 0 0 0 1px hsl(var(--primary) / .16); }
.doctype-badge { display: inline-block; color: hsl(var(--secondary-foreground)); background: hsl(var(--secondary)); padding: .28rem .65rem; border-radius: 10px 10px 10px 2px; font-weight: 700; font-size: .7rem; margin-bottom: .8rem; }
.doctype-card h3 { font-family: var(--app-font-sans); font-size: .92rem; }
.doctype-card p { margin: .4rem 0 0; color: hsl(var(--muted-foreground)); font-size: .78rem; line-height: 1.45; }
.doctype-card .validity { display: block; margin-top: .6rem; color: hsl(var(--accent)); font-weight: 700; font-size: .72rem; }

.credential-name { font-family: var(--app-font-serif); font-size: clamp(1.6rem, 4vw, 2.3rem); color: hsl(var(--primary)); margin: .5rem 0 .2rem; letter-spacing: -.02em; }
.credential-date { font-size: .7rem; color: hsl(var(--muted-foreground)); margin-top: .5rem; }

.sticky-advance { position: sticky; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; padding: .9rem 0 1.1rem; margin-top: 1.4rem; pointer-events: none; }
.sticky-advance-inner { pointer-events: auto; display: flex; align-items: center; gap: 1rem; background: hsl(var(--card) / .96); backdrop-filter: blur(10px); border: 1px solid hsl(var(--border)); box-shadow: var(--shadow-md); border-radius: 999px; padding: .6rem .6rem .6rem 1.3rem; animation: stage-in .35s ease both; }
.sticky-advance-inner span { font-size: .8rem; font-weight: 700; color: hsl(var(--primary)); white-space: nowrap; }
@media (max-width: 620px) { .sticky-advance-inner { flex-direction: column; align-items: stretch; text-align: center; border-radius: 1.2rem; padding: 1rem; } }

.stage-shell { max-width: 1180px; margin: 0 auto; padding: clamp(2rem, 5vw, 4.6rem) clamp(1rem, 4vw, 3rem) 5rem; position: relative; z-index: 1; }
.stage { animation: stage-in .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes stage-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
.eyebrow { display: flex; align-items: center; gap: .55rem; color: hsl(var(--primary)); font-weight: 700; text-transform: uppercase; font-size: .7rem; letter-spacing: .16em; }
.eyebrow::before { content: ''; width: 25px; height: 2px; background: hsl(var(--secondary)); }
h1, h2, h3 { font-family: var(--app-font-serif); font-weight: 700; letter-spacing: -.045em; line-height: .98; margin: 0; }
h1 { font-size: clamp(3.1rem, 8vw, 7.4rem); max-width: 800px; }
h2 { font-size: clamp(2.3rem, 5vw, 4.4rem); }
h3 { font-size: 1.35rem; letter-spacing: -.03em; }
.lede { color: hsl(var(--muted-foreground)); font-size: clamp(1rem, 1.5vw, 1.18rem); line-height: 1.65; max-width: 650px; margin: 1.35rem 0 0; }
.accent-word { color: hsl(var(--primary)); }
.button-row { display: flex; gap: .8rem; align-items: center; flex-wrap: wrap; margin-top: 2.2rem; }
.btn {
  border: 0; border-radius: 999px; padding: .82rem 1.2rem; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  font-weight: 700; font-size: .9rem; transition: transform .2s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(0); }
.btn-primary { color: hsl(var(--primary-foreground)); background: hsl(var(--primary)); box-shadow: 0 8px 18px hsl(var(--primary) / .2); }
.btn-primary:hover { background: hsl(207 82% 22%); box-shadow: 0 11px 24px hsl(var(--primary) / .28); }
.btn-quiet { color: hsl(var(--primary)); background: transparent; border: 1px solid hsl(var(--border)); }
.btn-quiet:hover { background: hsl(var(--muted)); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

.opening-grid { display: grid; grid-template-columns: 1.04fr .96fr; align-items: center; gap: clamp(2rem, 8vw, 7rem); min-height: calc(100dvh - 170px); }
.opening-note { margin-top: 2.2rem; display: flex; align-items: center; gap: .65rem; font-size: .79rem; color: hsl(var(--muted-foreground)); }
.opening-note strong { color: hsl(var(--foreground)); }
.route-card { min-height: 425px; border: 1px solid hsl(var(--border)); border-radius: 2rem; padding: 1.55rem; background: hsl(var(--card) / .74); box-shadow: var(--shadow-md); position: relative; overflow: hidden; }
.route-card::after { content:''; position:absolute; width: 270px; height:270px; border: 1px solid hsl(var(--secondary) / .25); border-radius: 50%; right: -85px; bottom: -95px; }
.route-label { display:flex; justify-content:space-between; color:hsl(var(--muted-foreground)); font-size:.7rem; text-transform:uppercase; letter-spacing:.13em; }
.route-label strong { color:hsl(var(--primary)); }
.route-map { position: relative; height: 318px; margin-top: 1rem; }
.route-line { position: absolute; left: 17%; right: 15%; top: 48%; height: 2px; background: hsl(var(--border)); transform: rotate(-15deg); transform-origin: center; }
.route-line::before { content:''; position:absolute; inset:0 56% 0 0; background:hsl(var(--secondary)); }
.route-node { position:absolute; display:flex; flex-direction:column; align-items:center; gap:.5rem; font-size:.68rem; font-weight:700; color:hsl(var(--muted-foreground)); text-align:center; max-width:90px; }
.route-node .node-dot { width: 44px; height:44px; display:grid; place-items:center; border-radius:50%; background:hsl(var(--background)); border: 1px solid hsl(var(--border)); color:hsl(var(--primary)); box-shadow: 0 0 0 6px hsl(var(--card)); }
.route-node.done .node-dot { color:hsl(var(--primary-foreground)); background:hsl(var(--primary)); border-color:hsl(var(--primary)); }
.route-node.active .node-dot { color:hsl(var(--secondary-foreground)); background:hsl(var(--secondary)); border-color:hsl(var(--secondary)); animation: pulse-dot 2.4s infinite; }
.route-node:nth-child(2){left:8%;top:43%}.route-node:nth-child(3){left:31%;top:27%}.route-node:nth-child(4){left:53%;top:34%}.route-node:nth-child(5){right:8%;top:14%}
@keyframes pulse-dot { 50% { box-shadow:0 0 0 10px hsl(var(--secondary) / .13); } }
.route-caption { position:absolute; left:1rem; bottom:.8rem; max-width:165px; font-family:var(--app-font-serif); font-size:1.18rem; line-height:1.12; color:hsl(var(--primary)); }

.module-head { display:flex; justify-content:space-between; align-items:flex-end; gap:2rem; margin-bottom:2.4rem; }
.module-head > div { max-width:730px; }
.module-head p { color:hsl(var(--muted-foreground)); line-height:1.6; margin:.9rem 0 0; }
.module-number { width: 62px; height:62px; border-radius: 20px 20px 20px 5px; display:grid; place-items:center; color:hsl(var(--secondary-foreground)); background:hsl(var(--secondary)); font-family:var(--app-font-serif); font-size:1.65rem; transform:rotate(3deg); flex:none; }
.alcoa-layout { display:grid; grid-template-columns: .9fr 1.1fr; gap:1.15rem; }
.alcoa-hero { min-height:490px; background:hsl(var(--primary)); border-radius:2rem; padding:2rem; color:hsl(var(--primary-foreground)); position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; }
.alcoa-hero::before { content:'A'; position:absolute; font:700 27rem/1 var(--app-font-serif); right:-2rem; bottom:-6.5rem; color:hsl(43 40% 97% / .06); }
.alcoa-hero p { max-width:275px; color:hsl(43 40% 97% / .72); line-height:1.6; position:relative; }
.alcoa-signal { display:flex; align-items:center; gap:.8rem; position:relative; }
.signal-ring { width:54px; height:54px; border:1px solid hsl(var(--secondary)); border-radius:50%; display:grid; place-items:center; color:hsl(var(--secondary)); }
.alcoa-hero small { color:hsl(43 40% 97% / .55); position:relative; }
.principles { display:grid; grid-template-columns: repeat(2, 1fr); gap:.75rem; }
.principle { text-align:left; border:1px solid hsl(var(--border)); background:hsl(var(--card) / .72); border-radius:1.2rem; padding:1.15rem; min-height:148px; cursor:pointer; transition:transform .22s ease, border-color .22s ease, background .22s ease; }
.principle:hover { transform:translateY(-4px); border-color:hsl(var(--secondary)); }
.principle.selected { border-color:hsl(var(--primary)); background:hsl(var(--primary) / .08); box-shadow:inset 0 0 0 1px hsl(var(--primary) / .16); }
.principle-letter { color:hsl(var(--secondary-foreground)); background:hsl(var(--secondary)); width:31px; height:31px; border-radius:10px 10px 10px 2px; display:grid; place-items:center; font-weight:700; margin-bottom:.8rem; }
.principle h3 { font-family:var(--app-font-sans); font-size:.9rem; letter-spacing:0; }
.principle p { margin:.4rem 0 0; color:hsl(var(--muted-foreground)); font-size:.78rem; line-height:1.45; }
.selected-detail { grid-column:1/-1; padding:1.2rem 1.35rem; border-left:3px solid hsl(var(--secondary)); background:hsl(var(--muted) / .65); border-radius:0 1rem 1rem 0; animation:stage-in .3s ease both; }
.selected-detail strong { color:hsl(var(--primary)); }

.hunt-layout { display:grid; grid-template-columns: 1fr .72fr; gap:1.4rem; align-items:start; }
.record-sheet { background:#f5fbfd; border:1px solid hsl(193 35% 74%); border-radius: .7rem; padding:1.5rem; box-shadow: 8px 9px 0 hsl(181 49% 58% / .2); color:#123e63; transform:rotate(-.5deg); position:relative; }
.record-sheet::before { content:'REGISTRO CONTROLADO'; position:absolute; right:1rem; top:1.1rem; font-size:.55rem; letter-spacing:.14em; color:#237fbb; transform:rotate(3deg); }
.sheet-title { font-family:var(--app-font-serif); font-size:2rem; margin:1.2rem 0 0; }
.sheet-subtitle { font-size:.68rem; color:#5d7d91; letter-spacing:.1em; text-transform:uppercase; margin:.35rem 0 1.5rem; }
.sheet-grid { display:grid; grid-template-columns: repeat(3,1fr); border-top:1px solid #b7d7e2; border-left:1px solid #b7d7e2; }
.sheet-cell { border-right:1px solid #b7d7e2; border-bottom:1px solid #b7d7e2; min-height:64px; padding:.55rem; font-size:.66rem; }
.sheet-cell span { display:block; font-size:.55rem; color:#5d7d91; text-transform:uppercase; letter-spacing:.07em; margin-bottom:.45rem; }
.hand { font-family:cursive; font-size:1rem; color:#075d91; }
.sheet-body { margin-top:1rem; border:1px solid #b7d7e2; padding:.8rem; min-height:120px; font-size:.7rem; line-height:1.7; position:relative; }
.red-flag { position:absolute; border:2px dashed #238dcc; border-radius:.35rem; cursor:pointer; background:hsl(204 66% 49% / .08); transition:background .2s, transform .2s; z-index:2; }
.red-flag:hover, .red-flag.found { background:hsl(181 49% 58% / .35); transform:scale(1.04); }
.flag-1 { width:79px; height:39px; top:46px; left:91px; }.flag-2 { width:90px; height:30px; top:20px; right:29px; }.flag-3 { width:100px; height:58px; bottom:18px; left:30px; }.flag-4 { width:34px; height:56px; bottom:17px; right:75px; }
.flag-number { position:absolute; width:22px; height:22px; border-radius:50%; background:#237fbb; color:#f5fbfd; display:grid; place-items:center; font-size:.7rem; font-weight:700; right:-10px; top:-10px; box-shadow:0 0 0 2px #f5fbfd; z-index:3; }
.flag-2 .flag-number { right:6px; top:-13px; }
.hunt-side { position:sticky; top:2rem; }
.hunt-count { display:flex; align-items:baseline; gap:.4rem; margin:.75rem 0 1rem; font-family:var(--app-font-serif); font-size:3.2rem; color:hsl(var(--primary)); }
.hunt-count small { font:600 .72rem var(--app-font-sans); color:hsl(var(--muted-foreground)); }
.hunt-instructions { color:hsl(var(--muted-foreground)); line-height:1.6; font-size:.9rem; }
.found-list { display:grid; gap:.55rem; margin-top:1.3rem; }
.found-item { display:flex; align-items:center; gap:.6rem; font-size:.82rem; padding:.65rem .75rem; border-radius:.7rem; color:hsl(var(--muted-foreground)); background:hsl(var(--muted) / .55); }
.found-item.found { color:hsl(var(--primary)); background:hsl(var(--primary) / .1); }
.feedback { margin-top:1.2rem; padding:1rem; border-radius:.9rem; background:hsl(var(--secondary) / .18); border:1px solid hsl(var(--secondary) / .46); animation:stage-in .25s ease both; font-size:.82rem; line-height:1.5; }
.feedback strong { display:block; color:hsl(var(--primary)); margin-bottom:.25rem; }

.dilemma-card { max-width:900px; margin:0 auto; background:hsl(var(--card) / .8); border:1px solid hsl(var(--border)); border-radius:2rem; box-shadow:var(--shadow-md); overflow:hidden; }
.dilemma-intro { padding:clamp(1.4rem, 4vw, 3rem); border-bottom:1px solid hsl(var(--border)); }
.scenario-meta { display:flex; align-items:center; gap:.55rem; color:hsl(var(--accent)); font-weight:700; font-size:.76rem; text-transform:uppercase; letter-spacing:.12em; margin-bottom:1.5rem; }
.scenario-meta svg { width:17px; }
.dilemma-quote { font-family:var(--app-font-serif); font-size:clamp(1.5rem, 3vw, 2.25rem); line-height:1.15; max-width:710px; color:hsl(var(--primary)); }
.dilemma-body { padding:clamp(1.2rem, 3vw, 2.2rem); }
.choice-list { display:grid; gap:.7rem; }
.choice { display:flex; gap:1rem; text-align:left; align-items:flex-start; width:100%; padding:1rem; border:1px solid hsl(var(--border)); border-radius:1rem; cursor:pointer; background:transparent; transition:border-color .2s, transform .2s, background .2s; }
.choice:hover { border-color:hsl(var(--primary)); transform:translateX(4px); }
.choice.chosen { border-color:hsl(var(--primary)); background:hsl(var(--primary) / .08); }
.choice-letter { flex:none; width:33px; height:33px; display:grid; place-items:center; border-radius:50%; color:hsl(var(--primary-foreground)); background:hsl(var(--primary)); font-weight:700; }
.choice strong { display:block; font-size:.9rem; margin-bottom:.24rem; color:hsl(var(--foreground)); }
.choice span { color:hsl(var(--muted-foreground)); line-height:1.45; font-size:.8rem; }
.choice-result { margin-top:1rem; padding:1rem 1.1rem; border-radius:.9rem; background:hsl(var(--primary) / .1); border-left:3px solid hsl(var(--primary)); line-height:1.55; font-size:.84rem; animation:stage-in .25s ease both; }
.choice-result.negative { background:hsl(var(--accent) / .1); border-color:hsl(var(--accent)); }

.quiz-layout { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1rem; }
.quiz-intro { grid-column:1/-1; display:flex; justify-content:space-between; align-items:end; gap:2rem; margin-bottom:.6rem; }
.quiz-intro p { color:hsl(var(--muted-foreground)); max-width:620px; line-height:1.55; margin:.8rem 0 0; }
.quiz-progress { text-align:right; color:hsl(var(--primary)); font-weight:700; font-size:.85rem; white-space:nowrap; }
.item-pool, .dropzone { border:1px solid hsl(var(--border)); border-radius:1.5rem; padding:1.25rem; background:hsl(var(--card) / .72); min-height:360px; }
.pool-heading, .drop-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
.pool-heading span, .drop-heading span { color:hsl(var(--muted-foreground)); font-size:.72rem; text-transform:uppercase; letter-spacing:.1em; }
.dropzone { border-style:dashed; border-color:hsl(var(--primary) / .5); background:hsl(var(--primary) / .045); transition:background .2s, border-color .2s; }
.dropzone.drag-over { background:hsl(var(--secondary) / .18); border-color:hsl(var(--secondary)); }
.dropzone.risk { border-color:hsl(var(--accent) / .65); background:hsl(var(--accent) / .04); }
.quiz-items { display:grid; gap:.6rem; }
.quiz-item { border:1px solid hsl(var(--border)); border-radius:.9rem; background:hsl(var(--background) / .7); padding:.75rem .8rem; display:flex; align-items:center; gap:.6rem; cursor:grab; font-size:.82rem; line-height:1.35; transition:transform .2s, border-color .2s, opacity .2s; }
.quiz-item:hover { border-color:hsl(var(--secondary)); transform:translateY(-2px); }
.quiz-item.selected { border-color:hsl(var(--secondary)); box-shadow:0 0 0 2px hsl(var(--secondary) / .18); }
.quiz-item.placed { cursor:default; background:hsl(var(--primary) / .07); }
.quiz-item svg { color:hsl(var(--secondary-foreground)); flex:none; }
.tap-hint { color:hsl(var(--muted-foreground)); font-size:.7rem; margin-top:1rem; display:flex; gap:.45rem; align-items:center; }
.quiz-score { grid-column:1/-1; margin-top:.8rem; padding:1.1rem 1.3rem; border-radius:1rem; background:hsl(var(--secondary) / .18); display:flex; align-items:center; justify-content:space-between; gap:1rem; animation:stage-in .3s ease both; }
.quiz-score strong { color:hsl(var(--primary)); }

.finish { min-height:calc(100dvh - 170px); display:grid; place-items:center; text-align:center; }
.finish-inner { max-width:780px; }
.seal { width:110px; height:110px; border:1px solid hsl(var(--secondary)); border-radius:50%; margin:0 auto 2rem; display:grid; place-items:center; color:hsl(var(--primary)); background:hsl(var(--secondary) / .17); position:relative; animation:seal-in .8s cubic-bezier(.2,.8,.2,1) both; }
.seal::before, .seal::after { content:''; position:absolute; border:1px solid hsl(var(--secondary) / .5); border-radius:50%; inset:8px; }.seal::after { inset:-9px; border-color:hsl(var(--primary) / .18); }
@keyframes seal-in { from { opacity:0; transform:scale(.7) rotate(-20deg); } to { opacity:1; transform:scale(1) rotate(0); } }
.finish h2 { max-width:760px; margin:0 auto; }
.finish-copy { font-size:1.08rem; line-height:1.7; color:hsl(var(--muted-foreground)); max-width:660px; margin:1.2rem auto 0; }
.credential { margin:2rem auto 0; border:1px solid hsl(var(--secondary)); max-width:540px; padding:1.8rem; border-radius:1.3rem; background:hsl(var(--card) / .8); text-align:left; position:relative; overflow:hidden; animation:stage-in .4s ease both; }
.credential::after { content:'R2P'; position:absolute; right:-10px; bottom:-45px; font:700 8rem/1 var(--app-font-serif); color:hsl(var(--secondary) / .12); }
.credential-logo { width: clamp(150px, 28vw, 205px); height: auto; display: block; margin-bottom: 1.2rem; }
.credential-kicker { text-transform:uppercase; letter-spacing:.14em; font-size:.63rem; color:hsl(var(--accent)); font-weight:700; }
.credential h3 { color:hsl(var(--primary)); margin:.75rem 0; }
.credential p { margin:0; color:hsl(var(--muted-foreground)); font-size:.82rem; line-height:1.5; }
.credential-meta { display:flex; justify-content:space-between; margin-top:1.4rem; font-size:.66rem; color:hsl(var(--muted-foreground)); }
.footer-note { text-align:center; color:hsl(var(--muted-foreground)); font-size:.72rem; margin-top:2rem; }

@media (max-width: 980px) {
  .quiz-layout { grid-template-columns: 1fr; }
}
@media (max-width: 780px) {
  .topbar { height:66px; }.progress-text { display:none; }
  .stage-shell { padding-top:2.2rem; }
  .opening-grid, .alcoa-layout, .hunt-layout, .quiz-layout { grid-template-columns:1fr; }
  .opening-grid { min-height:auto; gap:2.6rem; }
  .route-card { min-height:375px; }
  .route-map { height:270px; }
  .alcoa-hero { min-height:260px; }.alcoa-hero::before { font-size:16rem; bottom:-3.5rem; }
  .hunt-side { position:static; order:-1; }
  .quiz-intro { align-items:flex-start; flex-direction:column; gap:.6rem; }.quiz-progress { text-align:left; }
  .item-pool, .dropzone { min-height:200px; }
  .sheet-grid { grid-template-columns: repeat(2,1fr); }
  .module-head { align-items:flex-start; }.module-number { width:48px; height:48px; font-size:1.25rem; }
}
@media (max-width: 460px) {
  h1 { font-size:3.35rem; }.brand-logo { width: 118px; }.brand-copy small { max-width: 76px; font-size:.5rem; }
  .principles { grid-template-columns:1fr; }.principle { min-height:unset; }
  .route-card { padding:1rem; }.route-node { font-size:.6rem; }.route-node .node-dot { width:36px; height:36px; }
  .sheet-title { font-size:1.55rem; }
}
</style>
</head>

/* ---------- Shared UI ---------- */

function ProgressHeader({ stage, maxStage, onNavigate, onRestart }) {
  const percentage = stage === 0 ? 0 : Math.round((stage / 7) * 100);
  const handleRestart = () => {
    if (stage === 0 || window.confirm('Reiniciar a jornada? Todo o progresso desta sessão será perdido.')) {
      onRestart();
    }
  };
  return (
    <header className="topbar">
      <Logo />
      <div className="progress-wrap">
        <span className="progress-text">{stageNames[stage]} · {percentage}%</span>
        <nav className="stage-nav" aria-label="Navegação entre módulos">
          {stageNames.map((name, index) => (
            <React.Fragment key={name}>
              {index > 0 && <span className="stage-dot-sep" aria-hidden="true" />}
              <button
                className={`stage-dot ${index < stage ? 'done' : ''} ${index === stage ? 'current' : ''} ${index <= maxStage ? 'reachable' : ''}`}
                disabled={index > maxStage}
                onClick={() => index <= maxStage && onNavigate(index)}
                title={name}
                aria-current={index === stage ? 'step' : undefined}
              >
                {index < stage ? <Check size={13} /> : index}
              </button>
            </React.Fragment>
          ))}
        </nav>
        <div className="progress-track" aria-label={`Progresso: ${percentage}%`}>
          <div className="progress-value" style={{ width: `${percentage}%` }} />
        </div>
        {stage > 0 && (
          <button className="btn btn-quiet" style={{ padding: '.5rem .7rem', fontSize: '.72rem' }} onClick={handleRestart}>
            <RotateCcw size={14} /> Reiniciar
          </button>
        )}
      </div>
    </header>
  );
}

}

/* ---------- Stage 3: Correction & Signature ---------- */
function Correction({ next, back, answers, setAnswers }) {
  const answer = (scenarioId, optionId) => { setAnswers(prev => ({ ...prev, [scenarioId]: optionId })); };
  const score = correctionScenarios.filter(scenario => answers[scenario.id] === scenario.correct).length;
  const complete = Object.keys(answers).length === correctionScenarios.length;
  return (
    <section className="stage">
      <ModuleHead number="03" onBack={back} title={<>Corrigir certo é <span className="accent-word">tão importante quanto acertar.</span></>}
        intro="Cada situação abaixo é uma decisão real do dia a dia de documentação. Escolha a atitude correta e veja por que ela protege o registro." />
      <div style={{ display: 'grid', gap: '1.1rem' }}>
        {correctionScenarios.map(scenario => (
          <div key={scenario.id} className="dilemma-card" style={{ maxWidth: 'none', margin: 0 }}>
            <div className="dilemma-intro" style={{ padding: '1.3rem 1.5rem' }}>
              <div className="scenario-meta"><ShieldAlert size={17} /> Situação {scenario.id}</div>
              <p style={{ margin: 0, fontSize: '1.05rem', lineHeight: 1.5, color: 'hsl(var(--foreground))', fontFamily: 'var(--app-font-serif)' }}>{scenario.context}</p>
            </div>
            <div className="dilemma-body">
              <p style={{ color: 'hsl(var(--muted-foreground))', lineHeight: 1.6, marginTop: 0 }}>{scenario.question}</p>
              <div className="choice-list">
                {scenario.options.map(option => (
                  <button key={option.id} className={`choice ${answers[scenario.id] === option.id ? 'chosen' : ''}`} onClick={() => answer(scenario.id, option.id)}>
                    <span className="choice-letter">{option.id.toUpperCase()}</span>
                    <span style={{ color: 'hsl(var(--foreground))' }}>{option.text}</span>
                  </button>
                ))}
              </div>
              {answers[scenario.id] && (
                <div className={`choice-result ${answers[scenario.id] !== scenario.correct ? 'negative' : ''}`}>
                  <strong>{answers[scenario.id] === scenario.correct ? 'Correto.' : 'Não é o mais seguro.'}</strong> {scenario.feedback}
                </div>
              )}
            </div>
          </div>
        ))}
      </div>
      <div className="button-row" style={{ justifyContent: 'space-between', marginTop: '1.6rem' }}>
        <span style={{ fontSize: '.78rem', color: 'hsl(var(--muted-foreground))' }}>{complete ? `${score} de ${correctionScenarios.length} corretas.` : 'Responda todas as situações para avançar.'}</span>
        <button className="btn btn-primary" disabled={!complete} onClick={next}>Ir para hierarquia documental <ArrowRight size={17} /></button>
      </div>
    </section>
  );
}

  const classify = (itemId, bucket) => { setClassifyAnswers(prev => ({ ...prev, [itemId]: bucket })); };
  const classifyScore = docClassifyItems.filter(item => classifyAnswers[item.id] === item.correct).length;
  const classifyComplete = Object.keys(classifyAnswers).length === docClassifyItems.length;
  return (
    <section className="stage">
      <ModuleHead number="04" onBack={back} title={<>Cada documento tem <span className="accent-word">seu lugar na pirâmide.</span></>}

            <p>{doc.text}</p>
            <small className="validity">{doc.validity}</small>

        ))}
      </div>
      <p style={{ fontSize: '.78rem', color: 'hsl(var(--muted-foreground))', marginTop: '1rem' }}>
        {allDocsViewed ? 'Você conheceu todos os níveis documentais.' : `Clique em cada tipo de documento para continuar. (${docViewed.length}/${docTypes.length} vistos)`}
      </p>

      <div style={{ marginTop: '2.6rem' }}>
        <div className="quiz-intro" style={{ marginBottom: '1rem' }}>
          <div><h3 style={{ fontFamily: 'var(--app-font-serif)', fontSize: '1.5rem', margin: 0 }}>Registro ou Anexo?</h3>
            <p style={{ color: 'hsl(var(--muted-foreground))', marginTop: '.5rem', fontSize: '.85rem', lineHeight: 1.5 }}>Toque em cada exemplo e escolha a classificação correta.</p></div>
          <div className="quiz-progress">{Object.keys(classifyAnswers).length} / {docClassifyItems.length}<br /><span style={{ color: 'hsl(var(--muted-foreground))', fontWeight: 400 }}>exemplos classificados</span></div>
        </div>
        <div style={{ display: 'grid', gap: '.7rem' }}>
          {docClassifyItems.map(item => (
            <div key={item.id} style={{ border: '1px solid hsl(var(--border))', borderRadius: '1rem', padding: '1rem 1.2rem', background: 'hsl(var(--card) / .6)' }}>
              <p style={{ margin: '0 0 .7rem', fontSize: '.86rem', lineHeight: 1.5 }}>{item.text}</p>
              <div style={{ display: 'flex', gap: '.6rem', flexWrap: 'wrap' }}>
                {['registro', 'anexo'].map(bucket => (
                  <button key={bucket} className={`btn ${classifyAnswers[item.id] === bucket ? 'btn-primary' : 'btn-quiet'}`} style={{ padding: '.5rem 1rem', fontSize: '.78rem' }} onClick={() => classify(item.id, bucket)}>
                    {bucket === 'registro' ? 'Registro' : 'Anexo'}
                  </button>
                ))}
              </div>
              {classifyAnswers[item.id] && (
                <div className={`review-item ${classifyAnswers[item.id] === item.correct ? 'ok' : 'bad'}`} style={{ marginTop: '.6rem', paddingTop: '.6rem' }}>
                  {classifyAnswers[item.id] === item.correct ? <CheckCircle2 size={16} /> : <XCircle size={16} />}
                  <span>{classifyAnswers[item.id] === item.correct ? 'Classificação correta.' : `Classificação correta: ${item.correct === 'registro' ? 'Registro' : 'Anexo'}.`}</span>
                </div>
              )}
            </div>
          ))}
        </div>
        {classifyComplete && (
          <div className="feedback" style={{ marginTop: '1.2rem' }}>
            <strong>Resultado: {classifyScore} de {docClassifyItems.length}.</strong> Registros exigem impressão controlada e evidenciam o cumprimento de requisitos; Anexos apoiam a execução, sem esse controle obrigatório.
          </div>
        )}
      </div>

      <div className="button-row" style={{ justifyContent: 'space-between', marginTop: '1.8rem' }}>
        <span style={{ fontSize: '.78rem', color: 'hsl(var(--muted-foreground))' }}>{allDocsViewed && classifyComplete ? 'Módulo concluído.' : 'Veja todos os tipos e classifique todos os exemplos para avançar.'}</span>
        <button className="btn btn-primary" disabled={!allDocsViewed || !classifyComplete} onClick={next}>Ir para o dilema ético <ArrowRight size={17} /></button>
      </div>
    </section>
  );
}

/* ---------- Stage 5: Ethical Dilemma ---------- */
function Dilemma({ next, back, choice, setChoice }) {
  return (
    <section className="stage">
      <ModuleHead number="05" onBack={back} title={<>A decisão que aparece<br /><span className="accent-word">no fim do turno.</span></>}
        intro="Integridade também é o que fazemos sob pressão. Leia o cenário e escolha como você agiria." />
      <div className="dilemma-card">
        <div className="dilemma-intro">
          <div className="scenario-meta"><Clock3 size={17} /> Cenário · 5 minutos para o fim do turno</div>
          <div className="dilemma-quote">"Faltam 5 minutos para o fim do seu turno e a linha precisa ser liberada. Você percebe que esqueceu de registrar as medições de peso realizadas há duas horas. O sistema exige a hora exata da medição."</div>
        </div>
        <div className="dilemma-body">
          <p style={{ color: 'hsl(var(--muted-foreground))', lineHeight: 1.6, marginTop: 0 }}>O que você faz?</p>
          <div className="choice-list">
            {dilemmaChoices.map(item => (
              <button key={item.id} className={`choice ${choice === item.id ? 'chosen' : ''}`} onClick={() => setChoice(item.id)}>
                <span className="choice-letter">{item.id}</span><span><strong>{item.title}</strong><span>{item.text}</span></span>
              </button>
            ))}
          </div>
          {choice && (
            <div className={`choice-result ${dilemmaChoices.find(item => item.id === choice)?.negative ? 'negative' : ''}`}>
              <strong>{choice === 'B' ? 'Excelente decisão.' : 'Pare e reflita.'}</strong> {dilemmaChoices.find(item => item.id === choice)?.result}
            </div>
          )}
          <div className="button-row" style={{ justifyContent: 'flex-end', marginTop: '1.5rem' }}>
            <button className="btn btn-primary" disabled={!choice} onClick={next}>Escolher e avançar <ArrowRight size={17} /></button>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---------- Stage 6: Drag & Drop Quiz ---------- */
function Quiz({ next, back, placements, setPlacements }) {
  const [selected, setSelected] = useState(null);
  const [dragOver, setDragOver] = useState(null);
  const [reviewed, setReviewed] = useState(false);
  const place = (itemId, bucket) => { setPlacements(prev => ({ ...prev, [itemId]: bucket })); setSelected(null); setDragOver(null); };
  const score = quizItems.filter(item => placements[item.id] === item.correct).length;
  const complete = Object.keys(placements).length === quizItems.length;
  return (
    <section className="stage">
      {back && (
        <button className="btn-back" onClick={back} style={{ marginBottom: '.5rem' }}><ArrowLeft size={15} /> Voltar</button>
      )}
      <div className="quiz-layout">
        <div className="quiz-intro">
          <div><span className="eyebrow">Módulo 06</span><h2>Escolha o lado<br /><span className="accent-word">da integridade.</span></h2>
            <p>Arraste cada conduta para a caixa correspondente. No celular, toque em um item e depois na caixa de destino.</p></div>
          <div className="quiz-progress">{Object.keys(placements).length} / {quizItems.length}<br /><span style={{ color: 'hsl(var(--muted-foreground))', fontWeight: 400 }}>condutas classificadas</span></div>
        </div>
        <div className="item-pool">
          <div className="pool-heading"><strong>Condutas para classificar</strong><span>{quizItems.filter(i => !placements[i.id]).length} itens</span></div>
          <div className="quiz-items">
            {quizItems.filter(item => !placements[item.id]).map(item => (
              <div key={item.id} draggable
                onDragStart={(event) => event.dataTransfer.setData('text/plain', item.id)}
                className={`quiz-item ${selected === item.id ? 'selected' : ''}`}
                onClick={() => setSelected(selected === item.id ? null : item.id)}>
                <Hand size={15} />{item.text}
              </div>
            ))}
            {complete && <div className="tap-hint"><CheckCircle2 size={15} /> Todas as condutas foram classificadas.</div>}
          </div>
          <div className="tap-hint"><MousePointer2 size={14} /> Toque para selecionar ou arraste.</div>
        </div>
        {['integrity', 'risk'].map(bucket => (
          <div key={bucket} className={`dropzone ${bucket === 'risk' ? 'risk' : ''} ${dragOver === bucket ? 'drag-over' : ''}`}
            onDragOver={(event) => { event.preventDefault(); setDragOver(bucket); }}
            onDragLeave={() => setDragOver(null)}
            onDrop={(event) => { event.preventDefault(); const id = event.dataTransfer.getData('text/plain'); if (id) place(id, bucket); }}
            onClick={() => selected && place(selected, bucket)}>
            <div className="drop-heading"><strong>{bucket === 'integrity' ? 'Conduta de Integridade' : 'Risco de Não Conformidade'}</strong><span>{bucket === 'integrity' ? 'R2PHARMA' : 'Atenção'}</span></div>
            <div className="quiz-items">
              {quizItems.filter(item => placements[item.id] === bucket).map(item => (
                <div className="quiz-item placed" key={item.id}><Check size={15} />{item.text}</div>
              ))}
            </div>
            {quizItems.filter(item => placements[item.id] === bucket).length === 0 && (
              <p style={{ color: 'hsl(var(--muted-foreground))', fontSize: '.8rem', lineHeight: 1.5 }}>Solte aqui as condutas que pertencem a este caminho.</p>
            )}
          </div>
        ))}
        {complete && (
          <div className="quiz-score">
            <span><strong>Resultado: {score} de {quizItems.length}.</strong> {score === quizItems.length ? 'Você reconhece os sinais de uma cultura íntegra.' : 'Revise as escolhas para reforçar seu olhar.'}</span>
            <div style={{ display: 'flex', gap: '.6rem' }}>
              <button className="btn btn-quiet" onClick={() => setReviewed(!reviewed)}>{reviewed ? 'Ocultar revisão' : 'Ver revisão'}</button>
              <button className="btn btn-primary" onClick={next}>Ver conclusão <ArrowRight size={16} /></button>
            </div>
          </div>
        )}
        {complete && reviewed && (
          <div className="review-panel">
            {quizItems.map(item => {
              const ok = placements[item.id] === item.correct;
              return (
                <div key={item.id} className={`review-item ${ok ? 'ok' : 'bad'}`}>
                  {ok ? <CheckCircle2 size={16} /> : <XCircle size={16} />}
                  <span>
                    {item.text}
                    {!ok && <span className="fix">Classificação correta: {item.correct === 'integrity' ? 'Conduta de Integridade' : 'Risco de Não Conformidade'}.</span>}
                  </span>
                </div>
              );
            })}
          </div>
        )}
      </div>
      {complete && (
        <div className="sticky-advance">
          <div className="sticky-advance-inner">
            <span>Etapa concluída — {score} de {quizItems.length} condutas corretas</span>
            <button className="btn btn-primary" onClick={next}>Avançar para a conclusão <ArrowRight size={16} /></button>
          </div>
        </div>
      )}
    </section>
  );
}

/* ---------- Stage 7: Finish ---------- */
function Finish({ onRestart, summary, playerName }) {
  const [issued, setIssued] = useState(false);
  const completionDate = new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });

  const downloadCertificate = () => {
    if (!window.jspdf) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const primary = [15, 58, 92];
    const secondary = [70, 178, 179];
    const muted = [95, 115, 128];

    doc.setFillColor(248, 251, 252);
    doc.rect(0, 0, pageW, pageH, 'F');
    doc.setDrawColor(...secondary);
    doc.setLineWidth(1.1);
    doc.rect(8, 8, pageW - 16, pageH - 16);
    doc.setDrawColor(...primary);
    doc.setLineWidth(0.4);
    doc.rect(11, 11, pageW - 22, pageH - 22);

    try {
      const logoData = document.getElementById('app-data').textContent.trim();
      doc.addImage('data:image/png;base64,' + logoData, 'PNG', pageW / 2 - 20, 18, 40, 40 * (0.30));
    } catch (e) {}

    doc.setTextColor(...secondary);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(10);
    doc.text('R2PHARMA  ·  TREINAMENTO INTERNO', pageW / 2, 40, { align: 'center' });

    doc.setTextColor(...primary);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(30);
    doc.text('CERTIFICADO DE CONCLUSÃO', pageW / 2, 55, { align: 'center' });

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(...muted);
    doc.text('Certificamos que', pageW / 2, 70, { align: 'center' });

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(24);
    doc.setTextColor(...primary);
    doc.text(playerName.trim() || 'Participante', pageW / 2, 82, { align: 'center' });

    doc.setDrawColor(...secondary);
    doc.setLineWidth(0.4);
    doc.line(pageW / 2 - 45, 87, pageW / 2 + 45, 87);

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11.5);
    doc.setTextColor(...muted);
    const bodyText = 'concluiu com êxito a jornada "Guardião da Integridade", sobre Boas Práticas de Documentação e Integridade de Dados, alcançando o título de Guardião da Integridade R2PHARMA.';
    const bodyLines = doc.splitTextToSize(bodyText, pageW - 90);
    doc.text(bodyLines, pageW / 2, 98, { align: 'center' });

    const cols = [
      ['ALCOA+', summary.alcoaViewed + '/6'],
      ['Caça ao erro', summary.errorsFound + '/4'],
      ['Correção & assinatura', summary.correctionScore + '/5'],
      ['Hierarquia documental', summary.hierarchyScore + '/5'],
      ['Conduta', summary.quizScore + '/' + summary.quizTotal],
    ];
    const startX = pageW / 2 - ((cols.length * 42) / 2);
    doc.setFontSize(9);
    cols.forEach((col, index) => {
      const x = startX + index * 42 + 21;
      doc.setFont('helvetica', 'bold');
      doc.setTextColor(...primary);
      doc.text(col[1], x, 122, { align: 'center' });
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(...muted);
      doc.text(col[0], x, 127, { align: 'center' });
    });

    doc.setFontSize(9.5);
    doc.setTextColor(...muted);
    doc.text('Emitido em ' + completionDate, pageW / 2, 145, { align: 'center' });
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(9);
    doc.text('R2PHARMA · Excelência que cuida', pageW / 2, 152, { align: 'center' });

    const safeName = (playerName.trim() || 'participante').toLowerCase().replace(/[^a-z0-9]+/gi, '-');
    doc.save('certificado-guardiao-integridade-' + safeName + '.pdf');
  };

  return (
    <section className="stage finish">
      <div className="finish-inner">
        <div className="seal"><BadgeCheck size={42} strokeWidth={1.4} /></div>
        {issued ? (
          <>
            <span className="eyebrow" style={{ justifyContent: 'center' }}>Conquista registrada</span>
            <h2 style={{ marginTop: '1rem' }}>Parabéns, {playerName.trim() || 'Guardião'}.</h2>
            <div className="credential">
              <img className="credential-logo" src={logoSrc} alt="R2PHARMA" />
              <span className="credential-kicker">Badge de conclusão · R2PHARMA</span>
              <h3>Guardião da Integridade</h3>
              <p className="credential-name">{playerName.trim() || 'Participante'}</p>
              <p>Concluiu a jornada de boas práticas de documentação e integridade de dados.</p>
              <div className="credential-meta"><span>R2PHARMA · Excelência que cuida</span><span><CheckCircle2 size={13} style={{ verticalAlign: 'middle' }} /> concluído</span></div>
              <p className="credential-date">Emitido em {completionDate}</p>
            </div>
            <div className="button-row" style={{ justifyContent: 'center' }}>
              <button className="btn btn-primary" onClick={downloadCertificate}><Trophy size={16} /> Baixar certificado em PDF</button>
              <button className="btn btn-quiet" onClick={onRestart}><RotateCcw size={16} /> Reiniciar jornada</button>
            </div>
          </>
        ) : (
          <>
            <span className="eyebrow" style={{ justifyContent: 'center' }}>Jornada concluída</span>
            <h2 style={{ marginTop: '1rem' }}>A integridade dos dados constrói a nossa reputação e garante a saúde dos nossos clientes.</h2>
            <p className="finish-copy">Obrigado por fazer parte do padrão de excelência R2PHARMA, {playerName.trim() || 'colaborador(a)'}.</p>
            <div className="recap-grid">
              <div className="recap-card"><span>ALCOA+</span><strong>{summary.alcoaViewed}/6</strong><small>princípios revisados</small></div>
              <div className="recap-card"><span>Caça ao erro</span><strong>{summary.errorsFound}/4</strong><small>riscos identificados</small></div>
              <div className="recap-card"><span>Correção & assinatura</span><strong>{summary.correctionScore}/5</strong><small>situações corretas</small></div>
              <div className="recap-card"><span>Hierarquia documental</span><strong>{summary.hierarchyScore}/5</strong><small>exemplos classificados</small></div>
              <div className="recap-card"><span>Conduta</span><strong>{summary.quizScore}/{summary.quizTotal}</strong><small>condutas classificadas corretamente</small></div>
            </div>
            <div className="button-row" style={{ justifyContent: 'center' }}>
              <button className="btn btn-primary" onClick={() => setIssued(true)}>Emitir Certificado / Badge Guardião da Integridade <Trophy size={17} /></button>
            </div>
          </>
        )}
        <p className="footer-note"><LockKeyhole size={12} style={{ verticalAlign: 'middle', marginRight: '.3rem' }} /> Seu aprendizado fortalece cada elo do nosso cuidado.</p>
      </div>
    </section>
  );
}

/* ---------- Root App ---------- */
function App() {
  const [stage, setStage] = useState(0);
  const [maxStage, setMaxStage] = useState(0);
  const [playerName, setPlayerName] = useState('');
  const [alcoaViewed, setAlcoaViewed] = useState([]);
  const [errorsFound, setErrorsFound] = useState([]);
  const [correctionAnswers, setCorrectionAnswers] = useState({});
  const [docViewed, setDocViewed] = useState([]);
  const [classifyAnswers, setClassifyAnswers] = useState({});
  const [dilemmaChoice, setDilemmaChoice] = useState(null);
  const [quizPlacements, setQuizPlacements] = useState({});

  const goTo = (value) => { setStage(value); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  const next = () => { const value = Math.min(7, stage + 1); goTo(value); setMaxStage(m => Math.max(m, value)); };
  const back = () => goTo(Math.max(0, stage - 1));
  const restart = () => {
    setStage(0); setMaxStage(0); setPlayerName('');
    setAlcoaViewed([]); setErrorsFound([]); setCorrectionAnswers({});
    setDocViewed([]); setClassifyAnswers({}); setDilemmaChoice(null); setQuizPlacements({});
    window.scrollTo({ top: 0 });
  };

  const quizScore = quizItems.filter(item => quizPlacements[item.id] === item.correct).length;
  const correctionScore = correctionScenarios.filter(scenario => correctionAnswers[scenario.id] === scenario.correct).length;
  const hierarchyScore = docClassifyItems.filter(item => classifyAnswers[item.id] === item.correct).length;
  const summary = {
    alcoaViewed: alcoaViewed.length,
    errorsFound: errorsFound.length,
    correctionScore,
    hierarchyScore,
    quizScore,
    quizTotal: quizItems.length,
  };

  return (
    <main className="lms-app">
      <ProgressHeader stage={stage} maxStage={maxStage} onNavigate={goTo} onRestart={restart} />
      <div className="stage-shell">
        {stage === 0 && <Opening next={next} playerName={playerName} setPlayerName={setPlayerName} />}
        {stage === 1 && <Alcoa next={next} back={back} viewed={alcoaViewed} setViewed={setAlcoaViewed} />}
        {stage === 2 && <ErrorHunt next={next} back={back} found={errorsFound} setFound={setErrorsFound} />}
        {stage === 3 && <Correction next={next} back={back} answers={correctionAnswers} setAnswers={setCorrectionAnswers} />}
        {stage === 4 && <Hierarchy next={next} back={back} docViewed={docViewed} setDocViewed={setDocViewed} classifyAnswers={classifyAnswers} setClassifyAnswers={setClassifyAnswers} />}
        {stage === 5 && <Dilemma next={next} back={back} choice={dilemmaChoice} setChoice={setDilemmaChoice} />}
        {stage === 6 && <Quiz next={next} back={back} placements={quizPlacements} setPlacements={setQuizPlacements} />}
        {stage === 7 && <Finish onRestart={restart} summary={summary} playerName={playerName} />}
      </div>
    </main>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
