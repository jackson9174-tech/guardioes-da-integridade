.hero-row{display:flex;align-items:center;gap:1rem}.hero-row h1{min-width:0;flex:1 1 auto;font-size:clamp(2.6rem,5vw,4.6rem)}
.hero-mascot{flex:none;width:clamp(150px,16vw,250px);height:auto;filter:drop-shadow(0 10px 18px rgba(11,60,110,.22))}
.brand-sep{width:1px;height:34px;background:hsl(var(--border));margin:0 .55rem;flex:none}
select.name-input{appearance:auto}
@media (max-width:780px){.bplay{grid-template-columns:1fr;grid-template-areas:'draw' 'cart' 'hist'}.hero-row{gap:.4rem}.hero-mascot{width:clamp(105px,31vw,165px);margin-right:-.3rem}.hero-row h1{font-size:clamp(2.1rem,9.6vw,2.9rem)}.draw{gap:.7rem}.ball{width:86px;height:86px;font-size:2.4rem}.talk img{width:64px}.study{grid-template-columns:1fr}.bcell{font-size:.66rem;min-height:62px}.name-input{max-width:none;font-size:16px;min-height:48px}.button-row .btn{flex:1 1 100%;justify-content:center}.btn{min-height:46px}}
@media (max-width:380px){.bcell{font-size:.6rem;padding:.3rem .2rem}.talk img{display:none}}

.rw{max-width:1180px;margin:0 auto;padding:1rem}
.setup{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1.1rem;align-items:start}
@media(max-width:860px){.setup{grid-template-columns:1fr}}
textarea#nm{width:100%;min-height:300px;border:1.5px solid hsl(var(--border));border-radius:14px;padding:.8rem;font:500 1rem inherit;font-family:inherit;resize:vertical}
.prize{width:100%;border-radius:16px;border:1.5px solid hsl(var(--card-border));box-shadow:0 8px 24px rgba(11,60,110,.12)}
.mrow{display:flex;gap:.5rem;overflow:auto;padding:.3rem 0}
.mrow figure{margin:0;flex:none;width:92px;text-align:center;font-size:.68rem;color:hsl(var(--muted-foreground))}
.mrow img{width:92px;height:92px;object-fit:cover;border-radius:14px;border:1px solid hsl(var(--border));background:#fff}
.stagew{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,2.2fr) minmax(120px,1fr);gap:1rem;align-items:center;min-height:70vh}
@media(max-width:900px){.stagew{grid-template-columns:1fr}.stagew .side{display:none}}
.side img{width:100%;max-width:300px;display:block;margin:0 auto;animation:bob 3s ease-in-out infinite;border-radius:20px;background:#fff}
@keyframes bob{50%{transform:translateY(-12px) rotate(1.5deg)}}
.mid{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.9rem}
.mid .mimg{width:min(300px,60vw);height:min(300px,60vw);object-fit:contain;background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(11,60,110,.15)}
.mid .lbl{font:600 1rem inherit;font-family:inherit;color:hsl(var(--muted-foreground));margin:0}
.nameb{font:700 clamp(2.2rem,7vw,5.4rem)/1.05 'Fraunces',serif;color:hsl(var(--primary));min-height:1.2em;overflow-wrap:anywhere;padding:0 .5rem}
.nameb.spin{opacity:.85;filter:blur(.4px)}
.par{font:700 clamp(1.8rem,5vw,3.6rem) 'Fraunces',serif;color:#e07a00;margin:0;animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}
.vale{width:min(760px,92%);border-radius:20px;box-shadow:0 14px 40px rgba(224,122,0,.35);animation:pop .9s ease-out}
.ctl{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.bigbtn{font-size:1.25rem!important;padding:1rem 1.8rem!important;min-height:56px}
.cf{position:fixed;top:-20px;width:12px;height:18px;opacity:.95;animation:fall linear forwards;z-index:80;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
.hist{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-top:.5rem}.hist span{background:hsl(var(--muted));border-radius:999px;padding:.3rem .8rem;font-weight:700;font-size:.85rem;color:hsl(var(--primary))}
.full .topbar{display:none}.mut{color:hsl(var(--muted-foreground))}

const KEY='sorteio_vale_shopee_v1';
let S={scr:'setup',names:[],txt:'',won:[],cur:null,busy:false,excl:true};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x){S.txt=x.txt||'';S.won=x.won||[];S.excl=x.excl!==false}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({txt:S.txt,won:S.won,excl:S.excl}))}catch(e){}};
const parse=t=>{const seen=new Set(),out=[];t.split(/\r?\n|;/).map(x=>x.replace(/^\s*\d+\s*[.)\-]\s+/,'').replace(/^"|"$/g,'').trim()).forEach(n=>{if(n&&!seen.has(n.toLowerCase())){seen.add(n.toLowerCase());out.push(n)}});return out};
const rnd=n=>{const a=new Uint32Array(1);const lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n};
const pool=()=>S.names.filter(n=>!S.excl||!S.won.includes(n));
let mi=0,mt=null;
function setup(){S.scr='setup';clearInterval(mt);const n=parse(S.txt).length;
 $('cn').textContent=n+' nome(s)';
 $('app').innerHTML=`<div class="rw"><div class="setup"><div class="card"><div class="tag">Sorteio · Guardiões da Qualidade</div><h1 style="margin:.2rem 0">Sorteio do <span class="accent-word">Vale-Presente</span> Shopee</h1><p class="mut">Cole a lista de participantes (um nome por linha) ou carregue um arquivo .txt / .csv. Nomes repetidos são contados uma vez só.</p>
 <textarea id="nm" placeholder="Maria Souza&#10;João Pereira&#10;Ana Lima…" oninput="S.txt=this.value;save();$('cn').textContent=parse(S.txt).length+' nome(s)'">${escH(S.txt)}</textarea>
 <div class="ctl" style="justify-content:flex-start;margin-top:.7rem"><label class="btn btn-quiet" style="cursor:pointer">📄 Carregar arquivo<input type="file" accept=".txt,.csv,text/plain" hidden onchange="loadF(this)"></label><button class="btn btn-quiet" onclick="S.txt='';save();setup()">Limpar lista</button></div>
 <label style="display:flex;gap:.5rem;align-items:center;margin:.8rem 0"><input type="checkbox" ${S.excl?'checked':''} onchange="S.excl=this.checked;save()"> Não sortear de novo quem já ganhou</label>
 <button class="btn btn-primary bigbtn" onclick="start()">🎲 Ir para o sorteio →</button>${S.won.length?`<p class="mut" style="margin:.8rem 0 0">Ganhadores anteriores: <b>${S.won.map(escH).join(', ')}</b> <button class="btn btn-quiet sm" onclick="if(confirm('Zerar o histórico de ganhadores?')){S.won=[];save();setup()}">zerar</button></p>`:''}</div>
 <div class="card"><h2 style="margin-top:0">🎁 Prêmio</h2><img class="prize" src="${VALE}" alt="Vale-presente Shopee de R$ 100,00 · Guardiões da Qualidade"><p class="mut" style="margin:.7rem 0 .3rem">Os mascotes dos temas participam do sorteio:</p><div class="mrow">${MAS.map(m=>`<figure><img src="${m[1]}" alt="Mascote ${escH(m[0])}"><figcaption>${escH(m[0])}</figcaption></figure>`).join('')}</div></div></div></div>`}
function loadF(i){const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.txt=String(r.result||'');save();setup()};r.readAsText(f)}
function start(){S.names=parse(S.txt);if(S.names.length<1){alert('Informe pelo menos 1 nome.');return}S.cur=null;stage()}
function stage(){S.scr='stage';const p=pool();$('cn').textContent=p.length+' participante(s) no sorteio';clearInterval(mt);
 const m=MAS[mi%MAS.length];
 const side=k=>`<div class="side"><img src="${MAS[(mi+k)%MAS.length][1]}" alt="Mascote ${escH(MAS[(mi+k)%MAS.length][0])}"></div>`;
 const w=S.cur;
 $('app').innerHTML=`<div class="rw"><div class="stagew">${side(1)}<div class="mid">
 ${w?`<p class="par">🎉 Parabéns! 🎉</p><div class="nameb" id="nb">${escH(w)}</div><img class="vale" src="${VALE}" alt="Vale-presente Shopee R$ 100,00">`
   :`<img class="mimg" id="mi" src="${m[1]}" alt="Mascote ${escH(m[0])}"><p class="lbl" id="ml">${escH(m[0])}</p><div class="nameb" id="nb">${p.length?'Pronto para sortear?':'Todos já foram sorteados'}</div><p class="mut" style="margin:0">Vale-presente Shopee · R$ 100,00</p>`}
 <div class="ctl">${p.length?`<button class="btn btn-primary bigbtn" onclick="draw()">${w?'🎲 Sortear novamente':'🎲 Sortear ganhador'}</button>`:''}<button class="btn btn-quiet" onclick="setup()">← Lista</button><button class="btn btn-quiet" onclick="fs()">⛶ Tela cheia</button></div>
 ${S.won.length?`<div class="hist">${S.won.map((x,i)=>`<span>${i+1}º · ${escH(x)}</span>`).join('')}</div>`:''}
 </div>${side(2)}</div></div>`;

function beep(f,t,d,v){try{const A=window.__A||(window.__A=new(window.AudioContext||window.webkitAudioContext)());const o=A.createOscillator(),g=A.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(A.destination);const s=A.currentTime+t;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v||.18,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.start(s);o.stop(s+d+.02)}catch(e){}}
